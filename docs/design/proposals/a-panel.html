<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Maquette A — fiche d'œuvre recomposée</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* ============ FICHE D'ŒUVRE — spec commune A/B/C ========================
         - image bord à bord, rayon 0, aucun filet autour de l'image
         - méta en grille 2 × 2 avec filets 1 px
         - actions sur une seule ligne (1 plein + 1 filet)
         - navigation préc./suiv. remontée dans la barre de titre
         ========================================================================= */
      #progress {
        position: absolute; top: 0; left: 0;
        height: 1px; width: 44%;
        background: var(--accent); opacity: 0.85; z-index: 12;
      }
      .brand {
        position: absolute; top: 28px; left: 32px; z-index: 10;
        display: flex; align-items: baseline; gap: 14px;
      }
      .brand__name { font-family: var(--serif); font-weight: 600; font-size: 19px; }
      .brand__rule { width: 22px; height: 1px; background: var(--line); transform: translateY(-4px); }
      .brand__sub { font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }

      .nav {
        position: absolute; right: 32px; bottom: 30px; z-index: 10;
        display: flex; align-items: center; gap: 10px;
      }
      .nav__arrow {
        width: 36px; height: 36px; border: 1px solid var(--line); border-radius: var(--r-round);
        background: rgba(255, 253, 249, 0.62); backdrop-filter: blur(4px);
        color: var(--ink); font-size: 14px; cursor: pointer; display: grid; place-items: center;
      }
      .nav__index {
        margin-left: 8px; background: none; border: 0; border-bottom: 1px solid var(--line);
        padding: 3px 0; font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase;
        color: var(--ink); cursor: pointer;
      }

      .panel__bar {
        flex: none;
        height: 52px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 var(--s4) 0 var(--s5);
        border-bottom: 1px solid var(--line);
      }
      .panel__back, .panel__x {
        background: none; border: 0; cursor: pointer; color: var(--muted);
        font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase;
        display: inline-flex; align-items: center; gap: var(--s2);
        transition: color var(--d-fast);
      }
      .panel__x { font-size: 18px; letter-spacing: 0; color: var(--ink); opacity: 0.65; padding: 0 4px; }
      .panel__back:hover, .panel__x:hover { color: var(--ink); opacity: 1; }

      .panel__imgwrap { position: relative; flex: none; }
      .panel__imgwrap::after {
        /* ombre douce sous l'image — la seule « profondeur » de la fiche */
        content: '';
        display: block;
        height: 1px;
        background: var(--line);
      }

      @media (max-width: 720px) {
        .brand { top: 16px; left: 16px; gap: 10px; }
        .brand__name { font-size: 15.5px; }
        .brand__rule { display: none; }
        .brand__sub { font-size: 8.5px; letter-spacing: 0.18em; }
        .nav { left: 16px; right: 16px; bottom: 20px; justify-content: space-between; }
        .nav__arrow { width: 44px; height: 44px; font-size: 15px; }
        .panel { width: 100vw; border-left: 0; }
        .panel__body { padding: var(--s5) var(--s5) var(--s7); gap: var(--s5); }
        .panel__title { font-size: 25px; }
        .meta-grid { grid-template-columns: 1fr; }
        .meta-grid > div:nth-child(even) { border-left: 0; padding-left: 0; }
        .meta-grid > div:nth-child(odd) { padding-right: 0; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="plate" style="background-image: url('refs/plate-wall-wide.jpg')"></div>
      <div id="progress"></div>

      <header class="brand">
        <span class="brand__name">Eric Houvenagel</span>
        <span class="brand__rule"></span>
        <span class="brand__sub">Huile &amp; aquarelle</span>
      </header>

      <nav class="nav">
        <button class="nav__arrow" aria-label="Œuvre précédente">‹</button>
        <button class="nav__arrow" aria-label="Œuvre suivante">›</button>
        <button class="nav__index">Index</button>
      </nav>

      <aside class="panel" aria-label="Fiche de l'œuvre">
        <div class="panel__bar">
          <button class="panel__back"><span>←</span> Galerie</button>
          <button class="panel__x" aria-label="Fermer la fiche">×</button>
        </div>
        <div class="panel__imgwrap">
          <img class="panel__img" src="refs/work-morbihan.jpg" alt="Morbihan" />
        </div>
        <div class="panel__body">
          <div class="panel__kicker">
            <span class="micro accent">Œuvre 02 / 05</span>
            <span style="display: flex; gap: 14px">
              <button class="panel__nav" aria-label="Précédente">‹</button>
              <button class="panel__nav" aria-label="Suivante">›</button>
            </span>
          </div>

          <h2 class="panel__title">Morbihan</h2>

          <dl class="meta-grid">
            <div><dt>Année</dt><dd class="num">2026</dd></div>
            <div><dt>Technique</dt><dd>Aquarelle sur papier 300 g et wax</dd></div>
            <div><dt>Dimensions</dt><dd>—</dd></div>
            <div><dt>Salle</dt><dd>Marines &amp; Bretagne</dd></div>
          </dl>

          <p class="panel__desc">
            La côte du Morbihan, entre terre, eau et collines.
          </p>

          <div class="panel__actions">
            <button class="btn btn--primary">Voir en grand</button>
            <button class="btn">Index</button>
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>
